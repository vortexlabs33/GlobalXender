<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalXender - P2P Share</title>
    <!-- Include PeerJS Library for direct device-to-device internet transfer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input, button {
            padding: 12px;
            margin: 8px 0;
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        input { background: #334155; color: #fff; text-align: center; }
        button { background: #10b981; color: white; font-weight: bold; cursor: pointer; }
        button:active { background: #059669; }
        #status { font-weight: bold; color: #38bdf8; margin: 10px 0; }
        #incomingFiles { margin-top: 15px; }
    </style>
</head>
<body>

    <h1>🌍 GlobalXender</h1>
    <p>Direct Phone-to-Phone Transfer</p>

    <!-- Step 1: Identity -->
    <div class="card">
        <h3>Your Connection ID</h3>
        <div id="myId" style="font-size: 14px; color: #fbbf24; word-break: break-all;">Connecting to network...</div>
    </div>

    <!-- Step 2: Connect to a Friend -->
    <div class="card">
        <h3>Connect to Peer</h3>
        <input type="text" id="friendIdInput" placeholder="Enter Friend's ID">
        <button onclick="connectToPeer()">Connect</button>
        <div id="status">Status: Disconnected</div>
    </div>

    <!-- Step 3: Send Files -->
    <div class="card" id="transferCard" style="display:none;">
        <h3>Send File</h3>
        <input type="file" id="fileInput">
        <button onclick="sendFile()">Send File</button>
        <p id="progress"></p>
    </div>

    <!-- Step 4: Received Files -->
    <div class="card">
        <h3>Received Files</h3>
        <div id="incomingFiles">No files received yet.</div>
    </div>

    <script>
        let peer;
        let conn;
        let localFile = null;

        // Initialize Peer object on load
        function initPeer() {
            peer = new Peer(); // Uses free public PeerJS cloud signaling server

            peer.on('open', (id) => {
                document.getElementById('myId').innerText = id;
            });

            // Handle incoming connection requests from peers (e.g., your friend in America)
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                document.getElementById('status').innerText = "Status: Connected to Friend!";
                document.getElementById('transferCard').style.display = 'block';
            });
        }

        function connectToPeer() {
            const friendId = document.getElementById('friendIdInput').value.trim();
            if (!friendId) return alert("Please enter a valid peer ID!");

            document.getElementById('status').innerText = "Connecting...";
            conn = peer.connect(friendId);

            conn.on('open', () => {
                document.getElementById('status').innerText = "Status: Connected to Friend!";
                document.getElementById('transferCard').style.display = 'block';
            });

            setupConnection();
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (data.file) {
                    // Reconstruct file blob from received raw bytes
                    const blob = new Blob([data.file], { type: data.fileType });
                    const url = URL.createObjectURL(blob);
                    
                    const container = document.getElementById('incomingFiles');
                    container.innerHTML = `
                        <p>📥 Received: <strong>${data.fileName}</strong></p>
                        <a href="${url}" download="${data.fileName}">
                            <button style="background: #3b82f6;">Download to Phone</button>
                        </a>
                    `;
                }
            });

            conn.on('close', () => {
                document.getElementById('status').innerText = "Status: Connection Closed";
                document.getElementById('transferCard').style.display = 'none';
            });
        }

        // Handle file selection
        document.getElementById('fileInput').addEventListener('change', (e) => {
            localFile = e.target.files[0];
        });

        function sendFile() {
            if (!localFile) return alert("Please select a file or app first!");
            if (!conn || !conn.open) return alert("Not connected to any peer!");

            document.getElementById('progress').innerText = "Sending " + localFile.name + "...";

            const reader = new FileReader();
            reader.readAsArrayBuffer(localFile);
            reader.onload = (event) => {
                const rawBuffer = event.target.result;
                // Send file buffer directly through WebRTC channel
                conn.send({
                    file: rawBuffer,
                    fileName: localFile.name,
                    fileType: localFile.type
                });
                document.getElementById('progress').innerText = "File sent successfully!";
            };
        }

        // Run initialization on page load
        window.onload = initPeer;
    </script>
</body>
</html>
